# 每次 push 到 main，就把本次推送的摘要写进 devlog issue 的**正文顶部**。
# 用编辑正文而不是新增评论 —— GitHub 对编辑不发通知，这样不会有邮件打扰。
# 作者身份是 GitHub App 机器人 dsh-rimielab[bot]。
#
# 首次使用需要在本仓库配置一个 secret：
#   DSH_APP_PRIVATE_KEY = App 设置里 "Generate a private key" 下载的 .pem 全文
# 未配置时本工作流只输出 warning，不会失败。

name: Devlog

on:
  push:
    branches: [main]

permissions: {}          # 不使用 GITHUB_TOKEN，全部走 App 安装令牌

concurrency:
  group: devlog
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - name: 检查 secret 是否就绪
        id: guard
        env:
          KEY: ${{ secrets.DSH_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::尚未配置 DSH_APP_PRIVATE_KEY，跳过记录（见 SETUP.md）"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 换取 App 安装令牌
        if: steps.guard.outputs.skip != 'true'
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: "5321359"     # v3 起推荐改用 client-id，见 SETUP.md
          private-key: ${{ secrets.DSH_APP_PRIVATE_KEY }}
          permission-issues: write

      - name: 把本次推送写进 devlog 正文
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PUSHER: ${{ github.event.pusher.name }}
          COMPARE: ${{ github.event.compare }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          COMMITS: ${{ toJSON(github.event.commits) }}
        run: |
          set -euo pipefail

          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --label devlog --state open \
                  --json number --jq 'sort_by(.number) | .[0].number // empty')
          if [ -z "$num" ]; then
            echo "::error::找不到带 devlog 标签的 open issue"
            exit 1
          fi

          # 1) 本次记录。注意：正文里一律不出现 @，否则会触发 mention 通知。
          {
            echo "### 工作段 · $(TZ=UTC date '+%Y-%m-%d %H:%M UTC')"
            echo
            echo "推送者 \`${PUSHER}\` ｜ [\`${BEFORE:0:7}...${AFTER:0:7}\`](${COMPARE})"
            echo
            echo "| 提交 | 作者 | 说明 |"
            echo "| --- | --- | --- |"
            if [ -z "${COMMITS:-}" ] || [ "${COMMITS}" = "null" ] || [ "${COMMITS}" = "[]" ]; then
              echo "| \`${AFTER:0:7}\` | — | （本次推送未携带提交明细） |"
            else
              echo "${COMMITS}" | jq -r '.[] | "| `\(.id[0:7])` | \(.author.name // .author.username // "?") | \(.message | split("\n")[0] | gsub("\\|"; "\\|")) |"'
            fi
            echo
          } > /tmp/entry.md

          # 2) 固定头部
          {
            echo "这个 issue 是本仓库的工作日志，由 \`dsh-rimielab[bot]\` 维护。"
            echo
            echo "## 约定"
            echo
            echo "- 每次 push 到 \`main\`，机器人把本次推送的摘要**追加到本正文顶部**（最新在上）。"
            echo "- 用**编辑正文**而不是新增评论 —— 编辑不会触发邮件通知。"
            echo "- 正文只保留最近 25 条，更早的可在本 issue 的编辑历史里翻。"
            echo "- 正文里不会出现 @，避免误触发 mention 通知。"
            echo "- 2026-10-16 及更早的记录以评论形式保留在本 issue 下方。"
            echo
            echo "<!-- DEVLOG:ENTRIES 最新在上，勿手工调序 -->"
          } > /tmp/prefix.md

          # 3) 现有正文（取标记之后的既有记录）
          gh issue view "$num" --repo "$GITHUB_REPOSITORY" --json body -q .body > /tmp/body.md || true
          touch /tmp/body.md

          # 4) 合并：新记录在最上，整体裁剪到 25 条
          python3 - <<'PY'
          import pathlib, re

          prefix = pathlib.Path("/tmp/prefix.md").read_text(encoding="utf-8")
          entry = pathlib.Path("/tmp/entry.md").read_text(encoding="utf-8")
          body = pathlib.Path("/tmp/body.md").read_text(encoding="utf-8")

          marker = "<!-- DEVLOG:ENTRIES"
          if marker in body:
              tail = body.split(marker, 1)[1]
              entries = tail.split("-->", 1)[1] if "-->" in tail else tail
          else:
              entries = ""

          merged = entry.strip() + ("\n\n" + entries.strip() if entries.strip() else "")
          parts = [p for p in re.split(r"(?=^### 工作段)", merged, flags=re.M) if p.strip()]
          parts = parts[:25]

          out = prefix.rstrip() + "\n\n" + "\n\n".join(p.strip() for p in parts) + "\n"
          pathlib.Path("/tmp/body.new.md").write_text(out, encoding="utf-8")
          print(f"记录条数: {len(parts)}，正文 {len(out)} 字符")
          PY

          gh issue edit "$num" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.new.md
          echo "已更新 issue #$num 正文"
