# 每次 push 到 main，就往 devlog issue 追加一条 comment（一个工作段一条）。
# 作者身份是 GitHub App 机器人 dsh-rimielab[bot]。
#
# 记录里刻意不出现 @用户名 —— mention 会重新激活已退订的 thread。
# 评论本身仍会通知订阅者：不想要就打开 issue → 右侧栏 → Unsubscribe。
#
# 首次使用需要在本仓库配置一个 secret：
#   DSH_APP_PRIVATE_KEY = App 设置里 "Generate a private key" 下载的 .pem 全文
# 未配置时本工作流只输出 warning，不会失败。

name: Devlog

on:
  push:
    branches: [main]

permissions: {}          # 不使用 GITHUB_TOKEN，全部走 App 安装令牌

concurrency:
  group: devlog
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - name: 检查 secret 是否就绪
        id: guard
        env:
          KEY: ${{ secrets.DSH_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::尚未配置 DSH_APP_PRIVATE_KEY，跳过记录（见 SETUP.md）"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 换取 App 安装令牌
        if: steps.guard.outputs.skip != 'true'
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: "5321359"     # v3 起推荐改用 client-id，见 SETUP.md
          private-key: ${{ secrets.DSH_APP_PRIVATE_KEY }}
          permission-issues: write

      - name: 定位 devlog issue 并刷新正文头部
        if: steps.guard.outputs.skip != 'true'
        id: find
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail

          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --label devlog --state open \
                  --json number --jq 'sort_by(.number) | .[0].number // empty')
          if [ -z "$num" ]; then
            echo "::error::找不到带 devlog 标签的 open issue"
            exit 1
          fi
          echo "num=$num" >> "$GITHUB_OUTPUT"

          # 正文只放约定，且每次运行都刷新，保证与工作流一致
          {
            echo "这个 issue 是本仓库的工作日志，由 \`dsh-rimielab[bot]\` 维护。"
            echo
            echo "## 约定"
            echo
            echo "- 每次 push 到 \`main\`，机器人追加一条 comment：**一个工作段一条**，按时间顺序往下。"
            echo "- 不新开 issue，用标签 \`devlog\` 过滤。"
            echo "- 记录里不出现 @用户名，避免误触发 mention 通知。"
            echo "- 正文只放约定，历史记录都在下面的评论里。"
            echo "- 2026-10-16 17:30 那条曾写在正文，见本 issue 的编辑历史。"
          } > /tmp/header.md

          gh issue edit "$num" --repo "$GITHUB_REPOSITORY" --body-file /tmp/header.md
          echo "已刷新 issue #$num 正文头部"

      - name: 追加工作段记录
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          NUM: ${{ steps.find.outputs.num }}
          PUSHER: ${{ github.event.pusher.name }}
          COMPARE: ${{ github.event.compare }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          COMMITS: ${{ toJSON(github.event.commits) }}
        run: |
          set -euo pipefail

          {
            echo "### 工作段 · $(TZ=UTC date '+%Y-%m-%d %H:%M UTC')"
            echo
            echo "推送者 \`${PUSHER}\` ｜ [\`${BEFORE:0:7}...${AFTER:0:7}\`](${COMPARE})"
            echo
            echo "| 提交 | 作者 | 说明 |"
            echo "| --- | --- | --- |"
            if [ -z "${COMMITS:-}" ] || [ "${COMMITS}" = "null" ] || [ "${COMMITS}" = "[]" ]; then
              echo "| \`${AFTER:0:7}\` | — | （本次推送未携带提交明细） |"
            else
              echo "${COMMITS}" | jq -r '.[] | "| `\(.id[0:7])` | \(.author.name // .author.username // "?") | \(.message | split("\n")[0] | gsub("\\|"; "\\|")) |"'
            fi
          } > /tmp/entry.md

          gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body-file /tmp/entry.md
          echo "已追加记录到 issue #$NUM"
